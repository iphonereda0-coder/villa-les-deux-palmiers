const REP_DEFAULT={traitementSalaire:'1',inclureTravauxSaison:true,mode:'parts',partsMoi:1,partsMaison:2,pctMoi:40,pctMaison:60,division:2,customMoi:0,customMaison:0,customAutre:0};
function loadRepConfig(){try{return{...REP_DEFAULT,...JSON.parse(localStorage.getItem('villa_rep_config')||'{}')}}catch(e){return{...REP_DEFAULT}}}
function saveRepConfig(cfg){localStorage.setItem('villa_rep_config',JSON.stringify(cfg))}
function getRepData(){
 const m=M||(new Date().toISOString().slice(0,7));
 const inP=d=>!m||String(d||'').startsWith(m);
 const resas=K('resa').filter(r=>inP(r.arrivee));
 const caBrut=sum(resas,tot);
 const salaire=sum(K('heures').filter(x=>inP(x.date)),x=>+x.montant||0)+sum(K('salaire_paye').filter(x=>inP(x.date)),x=>+x.montant||0);
 const menage=sum(K('menage').filter(x=>inP(x.date)),x=>+x.montant||0);
 const piscine=sum(K('stock_sortie').filter(x=>inP(x.date)&&(String(x.categorie||x.cat||'').toLowerCase().includes('piscine'))),x=>+x.cout||0);
 const groupe=sum(K('depense').filter(x=>inP(x.date)&&typeof GENERATOR_CATS!=='undefined'&&GENERATOR_CATS.includes(x.cat)),x=>+x.montant||0);
 const autres=sum(K('depense').filter(x=>inP(x.date)&&!(typeof GENERATOR_CATS!=='undefined'&&GENERATOR_CATS.includes(x.cat))),x=>+x.montant||0)+sum(K('citerne').filter(x=>inP(x.date)),x=>+x.prix||0);
 const travaux=K('travaux');
 const travauxSaison=sum(travaux.filter(x=>x.hors_saison!=='Oui'),x=>+(x.paye??x.montant)||0);
 const travauxHors=sum(travaux.filter(x=>x.hors_saison==='Oui'),x=>+(x.paye??x.montant)||0);
 return{caBrut,salaire,menage,piscine,groupe,autres,travauxSaison,travauxHors,periode:m};
}
function calcRepartition(cfg,data){
 const d=data||getRepData();
 let frais=d.menage+d.piscine+d.groupe+d.autres;
 if(cfg.inclureTravauxSaison)frais+=d.travauxSaison;
 let salaireAvant=0,salaireMoi=0,salaireMaison=0,libelleSalaire='';
 if(cfg.traitementSalaire==='1'){salaireAvant=d.salaire;libelleSalaire='Déduit avant partage'}
 else if(cfg.traitementSalaire==='2'){salaireMoi=d.salaire;libelleSalaire='Déduit de ma part'}
 else if(cfg.traitementSalaire==='3'){salaireMaison=d.salaire;libelleSalaire='Déduit de la part maison'}
 else{libelleSalaire='Non compté'}
 const restant=d.caBrut-frais-salaireAvant;
 let maPart=0,partMaison=0,partAutre=0;
 if(cfg.mode==='parts'){const total=(+cfg.partsMoi||0)+(+cfg.partsMaison||0);if(total>0){maPart=restant*(cfg.partsMoi/total);partMaison=restant*(cfg.partsMaison/total)}}
 else if(cfg.mode==='pourcentages'){maPart=restant*((+cfg.pctMoi||0)/100);partMaison=restant*((+cfg.pctMaison||0)/100)}
 else if(cfg.mode==='division'){if(+cfg.division===3){maPart=restant/3;partMaison=restant*2/3}else{maPart=restant/2;partMaison=restant/2}}
 else if(cfg.mode==='personnalise'){maPart=+cfg.customMoi||0;partMaison=+cfg.customMaison||0;partAutre=+cfg.customAutre||0}
 maPart-=salaireMoi;partMaison-=salaireMaison;
 return{...d,frais,libelleSalaire,restant,maPart,partMaison,partAutre,travauxSaisonInclus:!!cfg.inclureTravauxSaison};
}
function updateRepUI(){
 const cfg=loadRepConfig();
 const el=id=>document.getElementById(id);
 cfg.traitementSalaire=document.querySelector('input[name="rep_salaire"]:checked')?.value||cfg.traitementSalaire;
 cfg.inclureTravauxSaison=el('rep_inclure_travaux')?.checked??cfg.inclureTravauxSaison;
 cfg.mode=document.querySelector('.rep-mode.on')?.dataset.mode||cfg.mode;
 cfg.partsMoi=+el('rep_parts_moi')?.value||cfg.partsMoi;
 cfg.partsMaison=+el('rep_parts_maison')?.value||cfg.partsMaison;
 cfg.pctMoi=+el('rep_pct_moi')?.value||cfg.pctMoi;
 cfg.pctMaison=+el('rep_pct_maison')?.value||cfg.pctMaison;
 cfg.division=+el('rep_division')?.value||cfg.division;
 cfg.customMoi=+el('rep_custom_moi')?.value||0;
 cfg.customMaison=+el('rep_custom_maison')?.value||0;
 cfg.customAutre=+el('rep_custom_autre')?.value||0;
 saveRepConfig(cfg);
 const r=calcRepartition(cfg);
 const set=(id,val)=>{const e=el(id);if(e)e.textContent=val};
 set('rep_ca',DA(r.caBrut));
 set('rep_frais','− '+DA(r.frais));
 set('rep_salaire_txt',r.libelleSalaire+(r.salaire?' ('+DA(r.salaire)+')':''));
 set('rep_travaux_s',r.travauxSaisonInclus?'Inclus ('+DA(r.travauxSaison)+')':'Exclus ('+DA(r.travauxSaison)+')');
 set('rep_travaux_h',DA(r.travauxHors));
 set('rep_restant',DA(r.restant));
 set('rep_ma_part',DA(r.maPart));
 set('rep_part_maison',DA(r.partMaison));
 set('rep_part_autre',DA(r.partAutre));
 const ab=el('rep_autre_box');if(ab)ab.style.display=(r.partAutre>0||cfg.mode==='personnalise')?'block':'none';
}

/* Envoi des modifications locales au serveur, dans l’ordre. Retourne false si le réseau a coupé en route. */
async function pushOutbox(){

function homeMonths(start,end){const out=[],multiYear=start.getFullYear()!==new Date(end.getTime()-864e5).getFullYear();for(let c=new Date(start);c<end;c=new Date(c.getFullYear(),c.getMonth()+1,1)){const y=c.getFullYear(),m=c.getMonth();out.push({key:mk(y,m),y,m,days:new Date(y,m+1,0).getDate(),label:c.toLocaleDateString('fr-FR',{month:'short'}).replace('.','')+(multiYear?' '+String(y).slice(2):''),full:c.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})})}return out}
function niceStep(raw){if(!(raw>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function svgBars(rows,series,opt){
 const W=opt.w||1000,H=opt.h||300,Lx=opt.w?52:74,Rx=14,T=14,B=H-36,vals=rows.flatMap(r=>series.map(s=>+r.values[s.key]||0));
 let max=Math.max(0,...vals,opt.max||0),min=Math.min(0,...vals);if(max===min)max=min+1;
 const st=niceStep((max-min)/4);max=Math.ceil(max/st)*st;min=Math.floor(min/st)*st;
 const y=v=>T+(max-v)/(max-min)*(B-T);let svg='';
 for(let v=min;v<=max+st/2;v+=st){const yy=y(v);svg+='<line x1="'+Lx+'" x2="'+(W-Rx)+'" y1="'+yy+'" y2="'+yy+'" stroke="#e8edf0" stroke-dasharray="'+(Math.abs(v)<st/1e6?'0':'3 5')+'"/><text x="'+(Lx-9)+'" y="'+(yy+4)+'" text-anchor="end" fill="#68758a" font-size="12">'+esc(opt.fmt(v))+'</text>'}
 const step=(W-Lx-Rx)/rows.length,gw=Math.min(step*.74,series.length*34),bw=(gw-(series.length-1)*2)/series.length;
 rows.forEach((r,i)=>{const x0=Lx+step*i+(step-gw)/2,tip=esc(r.title);
  svg+='<g class="hc-month"><title>'+tip+'</title><rect x="'+(Lx+step*i)+'" y="'+T+'" width="'+step+'" height="'+(B-T)+'" fill="transparent"/>';
  series.forEach((s,j)=>{const v=+r.values[s.key]||0,ya=y(Math.max(0,v)),yb=y(Math.min(0,v)),h=v?Math.max(1.5,yb-ya):0;if(h)svg+='<rect x="'+(x0+j*(bw+2))+'" y="'+ya+'" width="'+bw+'" height="'+h+'" rx="'+Math.min(3,bw/2)+'" fill="'+(v<0&&s.negColor?s.negColor:s.color)+'"/>'});
  svg+='<text x="'+(Lx+step*(i+.5))+'" y="'+(B+21)+'" text-anchor="middle" fill="#68758a" font-size="12">'+esc(r.label)+'</text></g>'});
 svg+='<line x1="'+Lx+'" x2="'+(W-Rx)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#9aa5b3"/>';
 return'<div class="fin-svg-wrap"><svg class="fin-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.aria)+'">'+svg+'</svg></div>'}

 if(paid>0){const v=prompt('Le client a versé '+DA(paid)+'.\nMontant que tu lui rembourses (DA) ? 0 = l’argent versé est conservé.','0');if(v===null)return;const amount=Number(String(v).replace(',','.'));

/* Enregistre plusieurs opérations d’un coup (une seule transaction locale) : stock, mouvements, entretien et dépense liée restent cohérents. */
async function commitBatch(ops,msg='Enregistré ✓'){document.activeElement?.blur();
 const list=[],now=Date.now();let nr=R.slice();
 try{ops.forEach((o,i)=>{
  if(o.op==='insert'){const id=o.id||newId(),at=new Date(now+i).toISOString();list.push({op:'insert',id,kind:o.kind,data:o.data,at});nr.unshift({...o.data,id,kind:o.kind,at})}
  else if(o.op==='update'){const j=nr.findIndex(x=>x.id===o.id);if(j<0)throw new Error('Fiche introuvable');const{id,kind,at,...d}=nr[j],data={...d,...o.patch};list.push({op:'update',id,kind,data,at});nr[j]={...nr[j],...o.patch}}
  else if(o.op==='delete'){list.push({op:'delete',id:o.id});nr=nr.filter(x=>x.id!==o.id)}})}catch(e){toast(e.message||String(e),1);return false}
 if(!DB.ok){try{for(const x of list){const res=x.op==='insert'?await sb.from('records').insert({id:x.id,kind:x.kind,data:x.data}):x.op==='update'?await sb.from('records').update({data:x.data}).eq('id',x.id):await sb.from('records').delete().eq('id',x.id);if(res.error)throw res.error}}catch(e){toast('Enregistrement incomplet : '+(e.message||e)+' · rechargement',1);await legacyLoad();return false}
  R=nr;postDesktopBackup();saveFinancialCache();toast(msg);draw();return true}
 try{await queueOps(list)}catch(e){toast('Échec de l’enregistrement sur cet appareil : '+(e.message||e),1);return false}
 R=nr;saveFinancialCache();toast(savedMsg(msg));draw();return true}

/* Prépare les sorties de stock valorisées au coût moyen. lines = [{id,qte}] ; plusieurs lignes du même produit s’additionnent. */
function ipPlanOut(lines,meta){const work=new Map(),ops=[],rows=[];
 for(const l of lines){const x=R.find(r=>r.id===l.id&&r.kind==='stock');if(!x)throw new Error('Produit introuvable dans l’inventaire');
  const entered=q4(l.qte),unit=l.unite_saisie||l.unit||ipU(x),conv=ipConvert(x,entered,unit);if(!conv)throw new Error('Unité incompatible pour '+x.article);const q=conv.qte;if(!(q>0))throw new Error('Quantité invalide pour '+x.article);
  const cur=work.has(x.id)?work.get(x.id):(+x.qte||0);if(q>cur+1e-9)throw new Error('Stock insuffisant pour '+x.article+' : il reste '+fmtQ(cur)+' '+ipU(x));
  const cu=+x.cout_unitaire||0,cout=Math.round(q*cu*100)/100;work.set(x.id,q4(cur-q));
  const unitMeta=ipNormUnit(unit)===ipNormUnit(ipU(x))?{}:{qte_saisie:entered,unite_saisie:unit,facteur_conversion:conv.factor};
  rows.push({article_id:x.id,article:x.article,cat:x.cat,unite:ipU(x),qte:q,cout_unitaire:cu,cout,...unitMeta});
  ops.push({op:'insert',kind:'stock_sortie',data:{date:meta.date,article_id:x.id,article:x.article,cat:x.cat,unite:ipU(x),qte:q,...unitMeta,cout_unitaire:cu,cout:Math.round(cout),montant:Math.round(cout),motif:meta.motif||'Utilisation',...(meta.zone?{zone:meta.zone}:{}),...(meta.entretien_id?{entretien_id:meta.entretien_id}:{}),note:meta.note||''}})}
 for(const[id,v]of work)ops.push({op:'update',id,patch:{qte:v}});

/* ---------- Piscine : traitement chiffré + journal quotidien ---------- */
function poolPeriod(){const t=td(),p=IP.poolPer;return p==='7j'?{from:plus(-6),to:t,l:'7 derniers jours'}:p==='mois'?{from:t.slice(0,7)+'-01',to:t,l:'ce mois'}:p==='annee'?{from:t.slice(0,4)+'-01-01',to:t,l:'cette année'}:p==='tout'?{from:'0000',to:'9999',l:'depuis le début'}:{from:plus(-29),to:t,l:'30 derniers jours'}}
/* Une sortie compte pour la piscine si elle vient d’un traitement piscine, ou si c’est un produit piscine sorti sans être affecté à une autre zone. */
const poolOut=(s,ens)=>{const e=s.entretien_id&&ens.get(s.entretien_id);return e?e.zone==='Piscine':s.cat==='Piscine'&&(!s.zone||s.zone==='Piscine')};
function poolDays(from,to){const ens=new Map(K('entretien').map(e=>[e.id,e])),days={},inR=d=>d&&d>=from&&d<=to,day=d=>days[d]=days[d]||{date:d,items:{},prod:0,mo:0,acts:[],mes:[],legacy:[]};
 for(const s of K('stock_sortie')){if(!poolOut(s,ens)||!inR(s.date))continue;const D=day(s.date),k=s.article+'|'+(s.unite||''),it=D.items[k]=D.items[k]||{article:s.article,unite:s.unite||'',qte:0,cout:0};it.qte+=+s.qte||0;it.cout+=+s.cout||0;D.prod+=+s.cout||0}
 for(const e of K('entretien'))if(e.zone==='Piscine'&&inR(e.date)){const D=day(e.date);D.mo+=(+e.main_oeuvre||0)+(+e.autres||0);D.acts.push(e.titre);if(e.mesures)D.mes.push(e.mesures)}
 for(const p of K('piscine'))if(inR(p.date)){day(p.date).legacy.push(p)}
 return Object.values(days).sort((a,b)=>b.date.localeCompare(a.date))}
function poolLast(){const e=K('entretien').filter(x=>x.zone==='Piscine').map(x=>x.date),ens=new Map(K('entretien').map(x=>[x.id,x])),o=K('stock_sortie').filter(x=>poolOut(x,ens)).map(x=>x.date),l=K('piscine').map(x=>x.date);return[...e,...o,...l].filter(Boolean).sort().pop()||''}
function poolMes(){const m=K('entretien').filter(x=>x.zone==='Piscine'&&x.mesures).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.at).localeCompare(String(a.at)));const ph=m.find(x=>x.mesures.ph!=null),cl=m.find(x=>x.mesures.chlore!=null),tp=m.find(x=>x.mesures.temp!=null);return{ph,cl,tp}}

 month=sum(poolDays(t.slice(0,7)+'-01',t),d=>d.prod+d.mo),year=sum(poolDays(t.slice(0,4)+'-01-01',t),d=>d.prod+d.mo),w8=sum(poolDays(plus(-55),t),d=>d.prod+d.mo)/8,
 last=poolLast(),since=last?ipDays(last,t):null,M=poolMes(),phv=M.ph?.mesures.ph,clv=M.cl?.mesures.chlore,
 phPill=phv==null?'':`<span class="status-pill ${phv>=7.2&&phv<=7.6?'green':phv>=7&&phv<=7.8?'gold':'red'}">${phv>=7.2&&phv<=7.6?'Idéal':phv<7.2?'Trop bas':'Trop haut'}</span>`,

 low=K('stock').filter(s=>s.cat==='Piscine'&&miss(s)),pst=K('stock').filter(s=>s.cat==='Piscine').sort((a,b)=>String(a.article).localeCompare(String(b.article))),
 buys=sum(K('stock_achat').filter(x=>x.cat==='Piscine'&&x.date>=P.from&&x.date<=P.to),x=>x.montant)+sum(K('depense').filter(x=>!x.entretien_id&&x.date>=P.from&&x.date<=P.to&&finCat(x.cat)===FIN_CATEGORIES[1].name),x=>x.montant),
 byProd={};days.forEach(d=>Object.values(d.items).forEach(i=>{const k=i.article+'|'+i.unite,b=byProd[k]=byProd[k]||{article:i.article,unite:i.unite,qte:0,cout:0};b.qte+=i.qte;b.cout+=i.cout}));
 const long=P.from==='0000'||ipDays(P.from,P.to)>62,chartRows=long?Object.entries(days.reduce((a,d)=>{const k=d.date.slice(0,7);a[k]=(a[k]||0)+d.prod+d.mo;return a},{})).sort().slice(-12).map(([k,v])=>({label:k.slice(5)+'/'+k.slice(2,4),title:k+' · '+DA(v),values:{v}})):(()=>{const out=[];for(let d=P.from;d<=P.to;d=ad(d,1)){const D=days.find(x=>x.date===d);out.push({label:d.slice(8),title:d+' · '+DA(D?D.prod+D.mo:0),values:{v:D?D.prod+D.mo:0}})}return out})();

 <div class="g"><div class="kk c1"><small>Piscine ce mois</small><b>${DA(month)}</b></div><div class="kk c2"><small>Moyenne par semaine</small><b>${DA(w8)}</b></div><div class="kk c3"><small>Piscine cette année</small><b>${DA(year)}</b></div><div class="kk c4"><small>Dernière mesure</small><b>${phv!=null?'pH '+esc(String(phv).replace('.',',')):'—'}${clv!=null?' · Cl '+esc(String(clv).replace('.',',')):''}</b></div></div>
 ${phv!=null||clv!=null?`<div class="card"><h2>Qualité de l’eau</h2>${phv!=null?`<div class="td">pH <b>${esc(String(phv).replace('.',','))}</b> ${phPill} <span class="subtle">idéal 7,2 à 7,6 · mesuré le ${esc(M.ph.date)}</span></div>`:''}${clv!=null?`<div class="td">Chlore libre <b>${esc(String(clv).replace('.',','))} mg/L</b> ${clPill} <span class="subtle">idéal 1 à 3 mg/L · mesuré le ${esc(M.cl.date)}</span></div>`:''}${M.tp?`<div class="td">Eau à <b>${esc(String(M.tp.mesures.temp).replace('.',','))} °C</b> <span class="subtle">le ${esc(M.tp.date)}</span></div>`:''}</div>`:''}
 <div class="card"><h2>Traitement / entretien de la piscine</h2><p class="subtle" style="margin-bottom:12px">Choisis les produits du stock et la quantité mise dans l’eau : le stock baisse tout seul et le coût du jour est calculé au coût moyen d’achat.</p>${ipEntretienForm('Piscine')}</div>
 <div class="card"><div class="panel-title"><div><p class="subtle">JOURNAL QUOTIDIEN</p><h2>Dépenses piscine jour par jour</h2></div><button class="s" onclick="poolPrint()">🖨 Imprimer le journal</button></div>
 <div class="seg ip-seg">${[['7j','7 jours'],['30j','30 jours'],['mois','Ce mois'],['annee','Cette année'],['tout','Tout']].map(([k,l])=>`<button class="${IP.poolPer===k?'on':''}" onclick="IP.poolPer='${k}';draw()">${l}</button>`).join('')}</div>
 <div class="inventory-summary" style="margin-top:12px"><div class="k"><small>Total ${esc(P.l)}</small><b>${DA(tot)}</b><span class="subtle">produits ${DA(prodT)}${moT?' · main d’œuvre '+DA(moT):''}</span></div><div class="k"><small>Jours avec dépense</small><b>${costDays.length}</b></div><div class="k"><small>Moyenne par jour traité</small><b>${DA(costDays.length?tot/costDays.length:0)}</b></div><div class="k"><small>Achats de produits piscine</small><b>${DA(buys)}</b><span class="subtle">argent sorti sur la période</span></div></div>

 ${Object.keys(byProd).length?`<h3 class="hc-sub" style="margin-top:14px">Total par produit · ${esc(P.l)}</h3><div class="w"><table><tr><th>Produit</th><th>Quantité utilisée</th><th>Coût</th></tr>${Object.values(byProd).sort((a,b)=>b.cout-a.cout).map(b=>`<tr><td><b>${esc(b.article)}</b></td><td>${esc(fmtQ(b.qte))} ${esc(b.unite)}</td><td>${DA(b.cout)}</td></tr>`).join('')}</table></div>`:''}
 <h3 class="hc-sub" style="margin-top:14px">Détail par jour</h3>${days.map(d=>`<div class="row ip-day"><div style="min-width:0;flex:1"><b>${esc(wd(d.date))}</b>${d.acts.length?' · '+d.acts.map(esc).join(', '):''}<div class="subtle">${Object.values(d.items).map(i=>`${esc(fmtQ(i.qte))} ${esc(i.unite)} ${esc(i.article)} = ${DA(i.cout)}`).join(' · ')}${d.legacy.length?(Object.keys(d.items).length?' · ':'')+d.legacy.map(p=>esc(p.produit+(p.dose?' ('+p.dose+')':''))+' <i>sans coût</i>').join(' · '):''}${d.mo?' · main d’œuvre et frais '+DA(d.mo):''}${d.mes.length?' · '+d.mes.map(m=>[m.ph!=null?'pH '+fmtQ(m.ph):'',m.chlore!=null?'chlore '+fmtQ(m.chlore)+' mg/L':''].filter(Boolean).join(' · ')).filter(Boolean).join(', '):''}</div></div><b>${DA(d.prod+d.mo)}</b></div>`).join('')||'<p class="subtle">Aucun traitement sur cette période.</p>'}</div>
