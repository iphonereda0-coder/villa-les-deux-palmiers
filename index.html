function isFinDate(s){

 const p=s.split('-').map(Number);return !isNaN(d.getTime())&&d.getFullYear()===p[0]&&d.getMonth()+1===p[1]&&d.getDate()===p[2];
}
function finNum(v){const n=Number(v);return Number.isFinite(n)&&n>0?n:0}
function finCat(raw){

 if(s.includes('piscin')||s.includes('chlore')||s.includes('anti-alg'))return FIN_CATEGORIES[1].name;
 if(s.includes('répar')||s.includes('repar')||s.includes('travaux')||s.includes('artisan'))return FIN_CATEGORIES[3].name;

}

 let undatedReceiptAmount=0,undatedReceiptCount=0,undatedWorkAmount=0,undatedExpenseAmount=0,undatedExpenseCount=0;

function finPeriodBounds(){
 const now=new Date();let start,end;
 if(FPERIOD==='custom'){
  const s=FSTART||localFinDate(new Date(now.getFullYear(),now.getMonth()-5,1));
  const e=FEND||localFinDate(new Date(now.getFullYear(),now.getMonth(),now.getDate()));
  start=new Date(s+'T00:00:00');end=new Date(e+'T00:00:00');end.setDate(end.getDate()+1);
 }else{
  const n=FPERIOD==='12m'?12:6;
  start=new Date(now.getFullYear(),now.getMonth()-n+1,1);end=new Date(now.getFullYear(),now.getMonth()+1,1);
 }
 return{start,end};
}
function localFinDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function setFinancePeriod(v){
 FPERIOD=v;FSEL='';FCAT='';
 if(v==='custom'){
  const b=finPeriodBounds();FSTART=localFinDate(b.start);const e=new Date(b.end);e.setDate(e.getDate()-1);FEND=localFinDate(e);

}
function applyFinanceRange(){

function finRangeRows(rows,start,end){

}
function finRangeTotals(model,start,end){
 const rec=finRangeRows(model.receipts,start,end),exp=finRangeRows(model.expenses,start,end);
 return{income:sum(rec,x=>x.amount),expense:sum(exp,x=>x.amount),result:sum(rec,x=>x.amount)-sum(exp,x=>x.amount),receipts:rec,expenses:exp};
}
function finMonthRows(model,start,end){
 const rows=[];let cursor=new Date(start.getFullYear(),start.getMonth(),1);
 while(cursor<end){
  const next=new Date(cursor.getFullYear(),cursor.getMonth()+1,1),from=cursor<start?start:cursor,to=next>end?end:next;
  const key=cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0');
  const receipts=finRangeRows(model.receipts,from,to),expenses=finRangeRows(model.expenses,from,to);
  rows.push({key,label:cursor.toLocaleDateString('fr-FR',{month:'short'}),income:sum(receipts,x=>x.amount),expense:sum(expenses,x=>x.amount),result:sum(receipts,x=>x.amount)-sum(expenses,x=>x.amount),categories:FIN_CATEGORIES.map(c=>({name:c.name,color:c.color,value:sum(expenses.filter(x=>x.category===c.name),x=>x.amount)}))});
  cursor=next;
 }
 return rows;
}
function finComparisonBounds(bounds){
 const months=FPERIOD==='12m'?12:6;

 const span=bounds.end-bounds.start;return{start:new Date(bounds.start.getTime()-span),end:bounds.start};

function finBookingStats(model,start,end){

function vaultB64(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s)}
function vaultBytes(text){const s=atob(text);return Uint8Array.from(s,c=>c.charCodeAt(0))}
async function vaultDerive(pin,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:400000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vaultSeal(entries,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12)),plain=new TextEncoder().encode(JSON.stringify(entries)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);return{version:1,kdf:'PBKDF2-SHA-256',iterations:400000,salt:vaultB64(salt),iv:vaultB64(iv),ciphertext:vaultB64(new Uint8Array(cipher))}}
function touchVault(){if(!vaultUnlocked)return;clearTimeout(vaultTimer);vaultTimer=setTimeout(()=>lockVault(true),300000)}
function lockVault(notify=true){clearTimeout(vaultTimer);vaultTimer=null;vaultKey=null;vaultEntries=[];vaultUnlocked=false;if(notify)toast('Espace personnel verrouillé');if(grp==='personnel')draw()}
function askVaultCode(title,description){return new Promise(resolve=>{const overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(10,25,24,.72);display:grid;place-items:center;padding:18px';overlay.innerHTML=`<form style="background:#fff;color:#20352f;width:min(100%,420px);padding:24px;border-radius:18px;box-shadow:0 20px 70px #0005;font:inherit"><h2 style="margin:0 0 8px">🔐 ${title}</h2><p style="margin:0 0 16px;color:#5b6b65">${description}</p><label style="display:block;font-weight:700;margin-bottom:14px">Code personnel<input name="pin" type="password" minlength="8" autocomplete="current-password" required style="display:block;box-sizing:border-box;width:100%;margin-top:7px;padding:13px;border:1px solid #aab8b1;border-radius:10px;font:inherit;font-size:16px"></label><div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" data-cancel style="padding:11px 16px;border:0;border-radius:9px;background:#edf1ef;color:#263b34;font:inherit">Annuler</button><button type="submit" style="padding:11px 16px;border:0;border-radius:9px;background:#176b5b;color:white;font:inherit;font-weight:700">Continuer</button></div></form>`;const form=overlay.querySelector('form'),input=form.elements.pin;const done=value=>{overlay.remove();resolve(value)};form.onsubmit=e=>{e.preventDefault();if(input.value.length<8){input.setCustomValidity('Le code doit contenir au moins 8 caractères.');input.reportValidity();return}done(input.value)};input.oninput=()=>input.setCustomValidity('');overlay.querySelector('[data-cancel]').onclick=()=>done(null);overlay.onclick=e=>{if(e.target===overlay)done(null)};document.body.appendChild(overlay);input.focus()})}
async function openVault(){if(!own())return toast('Espace réservé au propriétaire',1);try{const rec=K('private_vault')[0];let pin=await askVaultCode(rec?'Entre ton code':'Créer mon code','Le code doit contenir au moins 8 caractères. Garde-le en lieu sûr : il ne peut pas être récupéré.');if(pin===null)return;let salt,key,entries=[];if(rec){salt=vaultBytes(rec.salt);key=await vaultDerive(pin,salt);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:vaultBytes(rec.iv)},key,vaultBytes(rec.ciphertext));entries=JSON.parse(new TextDecoder().decode(plain));if(!Array.isArray(entries))throw new Error('format')}else{const confirmPin=await askVaultCode('Confirmer mon code','Retape exactement le même code personnel.');if(confirmPin===null)return;if(confirmPin!==pin)return toast('Les codes ne correspondent pas',1);salt=crypto.getRandomValues(new Uint8Array(16));key=await vaultDerive(pin,salt);const sealed=await vaultSeal(entries,key,salt);const ok=await add('private_vault',sealed);if(!ok)return;}
vaultKey=key;vaultEntries=entries;vaultUnlocked=true;touchVault();draw()}catch(e){vaultKey=null;vaultEntries=[];vaultUnlocked=false;toast('Code incorrect ou espace chiffré illisible',1)}}async function saveVault(){const rec=K('private_vault')[0];if(!rec||!vaultKey)return false;const old=rec.data,seal=await vaultSeal(vaultEntries,vaultKey,vaultBytes(old.salt));if(!await upd(rec.id,seal))return false;touchVault();return true}
async function saveVaultCredit(ev){ev.preventDefault();touchVault();const f=ev.target,x={id:crypto.randomUUID(),kind:'credit',date:f.date.value,sens:f.sens.value,montant:+f.montant.value,note:f.note.value.trim()};if(!(x.montant>0))return toast('Indique un montant supérieur à zéro',1),false;const old=vaultEntries;vaultEntries=[x,...old];if(!await saveVault()){vaultEntries=old;draw();return false}toast('Mouvement personnel enregistré ✓');draw();return false}

function renderCalendarMonth(year, month, rs, today) {
 const first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7,monthStart=ds(year,month,1),monthEnd=ds(year,month+1,1);
 const monthBookings=rs.filter(r=>r.arrivee<monthEnd&&r.depart>monthStart).length;
 const weekdays=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
 let cells=weekdays.map(x=>'<span class="cal-weekday">'+x+'</span>').join('');
 for(let i=0;i<offset;i++)cells+='<span class="cal-empty" aria-hidden="true"></span>';
 for(let day=1;day<=days;day++){
  const date=ds(year,month,day),stay=rs.find(r=>r.arrivee<=date&&date<r.depart),arrival=rs.find(r=>r.arrivee===date),departure=rs.find(r=>r.depart===date),block=blk(date),event=fer(date);
  const isStart=date===selA,isEnd=date===selB,inRange=!!(selA&&selB&&date>selA&&date<selB),turnover=!!(arrival&&departure);
  let cls='cal-day';
  if(date===today)cls+=' is-today';if(isStart)cls+=' is-start';if(isEnd)cls+=' is-end';if(inRange)cls+=' is-range';
  if(stay)cls+=' is-booked';if(arrival)cls+=' has-arrival';if(departure)cls+=' has-departure';if(turnover)cls+=' is-turnover';if(block)cls+=' is-blocked';if(event)cls+=' has-event';
  const stayColor=stay?col(stay):arrival?col(arrival):departure?col(departure):'';
  const style=(stayColor?'--stay-color:'+stayColor+';':'')+(arrival?'--arrival-color:'+col(arrival)+';':'')+(departure?'--departure-color:'+col(departure)+';':'');
  const exactDate=new Date(date+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const status=turnover?'Départ et arrivée le même jour':arrival?'Arrivée · '+arrival.client:stay?'Séjour · '+stay.client:departure?'Départ · '+departure.client:block?'Bloqué · '+(block.motif||'Indisponible'):event?event:pDay(date)>0?'Tarif indicatif '+DA(pDay(date)):'Disponible';
  let label='';

  else if(arrival)label='<small class="cal-stay-label">'+esc((arrival.client||'Séjour').split(/\s+/)[0])+'</small>';
  else if(stay)label='<small class="cal-stay-note">Occupé</small>';
  else if(departure)label='<small class="cal-day-note">Départ</small>';
  else if(block)label='<small class="cal-day-note">Indisponible</small>';

  cells+='<button type="button" class="'+cls+'" style="'+style+'" aria-label="'+esc(exactDate+' · '+status)+'" aria-pressed="'+(isStart||isEnd?'true':'false')+'" title="'+esc(exactDate+' · '+status)+'" onclick="pick(\''+date+'\')"><span class="cal-day-number">'+day+'</span>'+label+'</button>';
 }
 const title=first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
 return '<section class="cal-month" aria-label="Calendrier '+esc(title)+'"><div class="cal-month-heading"><h3>'+esc(title)+'</h3><span>'+monthBookings+' séjour'+(monthBookings>1?'s':'')+'</span></div><div class="cal-grid">'+cells+'</div></section>';
}

 }
 const list=visibleBookings.map(r=>{const status=r.depart<=t?'Terminé':r.arrivee<=t?'En séjour':'À venir',due=Math.max(0,tot(r)-paidAmount(r));return '<article class="cal-booking"><span class="cal-booking-color" style="background:'+col(r)+'"></span><div class="cal-booking-info"><div class="cal-booking-line"><b>'+esc(r.client||'Réservation')+'</b><span class="status-pill '+(status==='Terminé'?'':status==='En séjour'?'green':'gold')+'">'+status+'</span></div><small>'+esc(r.arrivee)+' → '+esc(r.depart)+' · '+nights(r)+' nuit'+(nights(r)>1?'s':'')+' · '+esc(r.nb||'—')+' pers.</small><div class="cal-booking-money">'+DA(tot(r))+(due>0?' · reste '+DA(due):' · payé')+'</div></div><button type="button" class="s" onclick="bon(\''+r.id+'\')">Bon</button></article>'}).join('');
 return '<section class="calendar-page"><div class="cal-toolbar-card"><div class="cal-toolbar"><div class="cal-title"><span class="cal-eyebrow">PLANNING DES SÉJOURS</span><h2>Calendrier des réservations</h2><p>Choisis les dates de séjour; les nuits et le tarif estimé se mettent à jour.</p></div><div class="cal-toolbar-actions"><button type="button" class="cal-new-booking" onclick="go(\'sejours\',\'nouvelle\')">＋ Nouvelle réservation</button><div class="cal-nav"><button type="button" class="cal-arrow" onclick="mv(-1)" aria-label="Mois précédent">‹</button><button type="button" class="cal-today" onclick="cal=new Date();selA=selB=\'\';draw()">Aujourd’hui</button><button type="button" class="cal-arrow" onclick="mv(1)" aria-label="Mois suivant">›</button></div></div></div>'+calendarStats+'</div><div class="cal-calendar-card"><div class="cal-period-heading"><div><span class="cal-eyebrow">DISPONIBILITÉS</span><h3><span class="cal-primary-month">'+esc(primaryTitle)+'</span>'+(twoMonths?'<span class="cal-range-dash"> — </span><span class="cal-secondary-month">'+esc(secondaryTitle)+'</span>':'')+'</h3></div><span class="cal-period-note">'+(twoMonths?'Vue sur deux mois':'Vue mensuelle')+'</span></div><div class="cal-months '+(twoMonths?'two-months':'one-month')+'">'+renderCalendarMonth(y,mo,rs,t)+secondMonth+'</div><div class="cal-legend"><span><i class="cal-legend-dot available"></i>Disponible</span><span><i class="cal-legend-dot booked"></i>Séjour confirmé</span><span><i class="cal-legend-dot blocked"></i>Bloqué</span><span><i class="cal-legend-dot today"></i>Aujourd’hui</span><span class="cal-legend-price">Tarif indicatif par nuit</span></div></div><div class="cal-lower"><div class="cal-info-card">'+selection+'</div><div class="cal-info-card"><div class="cal-list-heading"><div><span class="cal-eyebrow">SÉJOURS ENREGISTRÉS</span><h3>Réservations affichées</h3></div><button type="button" class="s" onclick="go(\'sejours\',\'liste\')">Liste complète</button></div><div class="cal-bookings">'+(list||'<p class="cal-hint">Aucune réservation enregistrée sur la période affichée.</p>')+'</div></div></div></section>';
};

boot();
</script>
