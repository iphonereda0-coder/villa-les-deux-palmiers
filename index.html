function vaultB64(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s)}

 const y=cal.getFullYear(),mo=cal.getMonth(),n=new Date(y,mo+1,0).getDate(),off=(new Date(y,mo,1).getDay()+6)%7,rs=K('resa'),mm=mk(y,mo),t=td();
 const selected=selA&&selB?`${selA} → ${selB}`:selA||'';
 const reservationFor=d=>rs.find(r=>r.arrivee<=d&&d<r.depart);
 const cell=d=>{const rA=rs.find(r=>r.arrivee===d),rD=rs.find(r=>r.depart===d),r=reservationFor(d),b=blk(d),fe=fer(d);let cls='cd',bg='',label='';
  if(d===t)cls+=' t';if(d===selA||d===selB)cls+=' sel';if(selA&&selB&&d>selA&&d<selB)cls+=' in';if(b)cls+=' bk';if(fe)cls+=' fe';
  if(r){bg=col(r);label=(r.arrivee===d?'↘ ':'')+r.client.split(' ')[0];cls+=' b'}
  else if(rA){bg=col(rA);label='Arrivée · '+rA.client.split(' ')[0];cls+=' b'}
  else if(rD){bg=col(rD);label='Départ · '+rD.client.split(' ')[0];cls+=' b'}
  else if(b)label='⛔ Bloqué';else if(fe)label='🎉 '+fe;else{const p=pDay(d);if(p)label=Math.round(p/1000)+'k DA'}
  if(rA&&rD&&rA.id!==rD.id){label='↘ '+rA.client.split(' ')[0]+' / ↗ '+rD.client.split(' ')[0];bg=`linear-gradient(135deg,${col(rA)} 0 50%,${col(rD)} 50% 100%)`;cls+=' b'}
  const style=bg?`background:${bg}`:'';
  return `<div class="${cls}" style="${style}" onclick="pick('${d}')" title="${esc(d+(r?' · '+r.client:''))}"><b>${+d.slice(8)}</b>${label?`<small>${esc(label)}</small>`:''}</div>`};
 let grid=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<i>${x}</i>`).join('');for(let i=0;i<off;i++)grid+='<i></i>';for(let d=1;d<=n;d++)grid+=cell(ds(y,mo,d));
 const monthRes=rs.filter(r=>r.arrivee.slice(0,7)<=mm&&r.depart.slice(0,7)>=mm).sort((a,b)=>a.arrivee.localeCompare(b.arrivee));
 const count=monthRes.length,booked=Array.from({length:n},(_,i)=>ds(y,mo,i+1)).filter(d=>busy(d)).length,rate=Math.round(booked/n*100);
 let panel='';
 if(selA&&selB){const nn=Math.max(0,Math.round((new Date(selB)-new Date(selA))/864e5)),conf=rs.filter(r=>selA<r.depart&&selB>r.arrivee),block=K('bloc').filter(b=>selA<=b.fin&&selB>b.debut),est=rangeP(selA,selB);panel=`<div class="panel-title"><h2 style="margin:0">Période sélectionnée</h2><button class="s" onclick="clr()">Effacer</button></div><p style="margin-top:12px"><b>${esc(selA)} → ${esc(selB)}</b> · ${nn} nuit(s) · Estimation tarifaire : <b>${DA(est)}</b></p>${conf.length||block.length?`<p class="bad" style="margin-top:8px">Attention : ${conf.length?conf.length+' réservation(s) en conflit. ':''}${block.length?block.length+' blocage(s).':''}</p>`:'<p class="good" style="margin-top:8px">Aucun conflit visible dans les données chargées.</p>'}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button onclick="go('sejours','nouvelle')">Créer une réservation</button><button class="s" onclick="bloquer()">Bloquer la période</button></div>`}
 else if(selA){const r=rs.find(x=>x.arrivee<=selA&&selA<x.depart),b=blk(selA),fe=fer(selA);panel=`<div class="panel-title"><h2 style="margin:0">${new Date(selA+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2><button class="s" onclick="clr()">Effacer</button></div>${r?`<div class="row"><div><b>${esc(r.client)}</b><div class="subtle">${esc(r.tel)} · ${esc(r.nb)} personnes</div><div class="subtle">${esc(r.arrivee)} → ${esc(r.depart)}</div></div><div style="text-align:right"><b>${DA(tot(r))}</b><div class="subtle">Reste ${DA(Math.max(0,tot(r)-(+r.acompte||0)))}</div><button class="s" onclick="bon('${r.id}')">Bon</button></div></div>`:b?`<p class="bad">Période bloquée : ${esc(b.motif)}</p><button class="d" style="margin-top:8px" onclick="del('${b.id}')">Retirer le blocage</button>`:`<p class="good" style="margin-top:10px">${fe?'Jour signalé : '+esc(fe)+' · ':''}Aucune réservation pour cette date.</p><p class="subtle" style="margin-top:5px">Sélectionne une deuxième date pour définir le séjour.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button onclick="go('sejours','nouvelle')">Réserver à partir de cette date</button><button class="s" onclick="bloquer()">Bloquer cette date</button>${fe?'':`<button class="s" onclick="ferier()">Ajouter un événement</button>`}</div>`}`}
 else panel='<h2>Choisis les dates</h2><p class="subtle">Touche la date d’arrivée, puis la date de départ. Le départ n’est pas compté comme une nuit occupée.</p>';
 const list=monthRes.map(r=>`<div class="row"><div style="min-width:0"><div><span class="dot" style="background:${col(r)}"></span><b>${esc(r.client)}</b> <span class="status-pill ${r.depart<=t?'':'green'}">${r.depart<=t?'Terminé':r.arrivee<=t?'En séjour':'À venir'}</span></div><div class="subtle">${esc(r.arrivee)} → ${esc(r.depart)} · ${nights(r)} nuit(s) · ${esc(r.nb)} pers.</div></div><div style="text-align:right;flex:none"><b>${DA(tot(r))}</b><div class="subtle">${tot(r)>(+r.acompte||0)?'Reste '+DA(tot(r)-(+r.acompte||0)):'Payé'}</div><button class="s" onclick="bon('${r.id}')">Bon</button></div></div>`).join('');
 return `<div class="card"><div class="panel-title" style="margin-bottom:16px"><div><p class="subtle" style="margin-bottom:3px">PLANNING DES SÉJOURS</p><h2 style="font-size:1.25rem;margin:0">${cal.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2></div><div style="display:flex;gap:6px"><button class="s" onclick="mv(-1)" aria-label="Mois précédent">‹</button><button class="s" onclick="cal=new Date();selA=selB='';draw()">Aujourd’hui</button><button class="s" onclick="mv(1)" aria-label="Mois suivant">›</button></div></div><div class="g" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px"><div class="k"><small>Réservations</small><b>${count}</b></div><div class="k"><small>Nuits occupées</small><b>${booked}/${n}</b></div><div class="k"><small>Occupation</small><b>${rate}%</b></div></div><div class="cal">${grid}</div><div class="calendar-legend"><span><i class="legend-dot" style="background:#176b5b"></i> Séjour</span><span><i class="legend-dot" style="background:#d6a85f"></i> Aujourd’hui</span><span>⛔ Dates bloquées</span><span>🔴 Événement / jour férié</span></div></div><div class="card">${panel}</div><div class="card"><div class="panel-title"><h2>Réservations du mois</h2><button class="s" onclick="go('sejours','liste')">Liste complète</button></div>${list||'<p class="subtle">Aucune réservation sur ce mois.</p>'}</div>`;
};

boot();
</script>
